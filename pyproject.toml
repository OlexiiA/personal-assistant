[project]
name = "perso"
version = "0.1.0"
description = "Take your personal assistant"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Ihor M.", email = "mukovoz.igor@gmail.com" },
    { name = "Oleksii", email = "incretiblealex@gmail.com" },
    { name = "Myroslava", email = "myroslava.hnatiuk@ukr.net" },
]
dependencies = [
    "colorama>=0.4.6",
    "pydantic[email]>=2.13.4",
    "tabulate>=0.9.0",
]

[project.scripts]
perso = "perso.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
